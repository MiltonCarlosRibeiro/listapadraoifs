<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista Técnica - Padrão IFS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>
<div class="container">
    <header>
        <img src="assets/logo.png" alt="Logo Pakmatic" class="logo">
        <h1><span class="material-symbols-outlined">list_alt</span> Lista Técnica - Padrão IFS</h1>
    </header>

    <div class="button-bar">
        <button id="criarListaBtn"><span class="material-symbols-outlined">add_box</span> Criar Nova Lista</button>
        <label for="inputFile" class="file-label styled-importar">
            <span class="material-symbols-outlined">download</span> Importar Lista
            <input type="file" id="inputFile" accept=".xlsx, .xls" style="display: none;">
        </label>
        <button id="continuarListaBtn"><span class="material-symbols-outlined">add_task</span> Continuar Lista</button>
        <button id="salvarListaBtn"><span class="material-symbols-outlined">save</span> Salvar Lista</button>
        <button id="copiarSelecionadoBtn"><span class="material-symbols-outlined">content_copy</span> Copiar Selecionado</button>
        <button id="colarBtn"><span class="material-symbols-outlined">content_paste</span> Colar</button>
        <button id="deletarSelecionadosBtn"><span class="material-symbols-outlined">delete</span> Deletar Selecionados</button>
        <button id="inserirAcimaBtn"><span class="material-symbols-outlined">arrow_circle_up</span> Inserir Acima</button>
        <button id="inserirAbaixoBtn"><span class="material-symbols-outlined">arrow_circle_down</span> Inserir Abaixo</button>
        <button id="toggleSeqBtn"><span class="material-symbols-outlined">visibility</span> SEQ</button>
        <button id="toggleNivelColBtn"><span class="material-symbols-outlined">layers</span> NÍVEL</button>
        <button id="toggleHoverEffectBtn"><span class="material-symbols-outlined">straighten</span> Régua</button>
    </div>

    <div class="painting-controls">
        <h3><span class="material-symbols-outlined">palette</span> Ferramentas de Demarcação</h3>
        <div id="nivelColorButtons">
        </div>
        <div id="attentionColorButtons">
            <button class="paint-btn attention-yellow" data-color="#FFBF00"><span class="material-symbols-outlined">warning</span> Atenção</button>
            <button class="paint-btn attention-green" data-color="#28A745"><span class="material-symbols-outlined">check_circle</span> OK</button>
            <button class="paint-btn attention-red" data-color="#DC3545"><span class="material-symbols-outlined">error</span> Crítico</button>
        </div>
        <button id="clearPaintBtn"><span class="material-symbols-outlined">clear</span> Limpar Seleção de Cor</button>
        <label><input type="checkbox" id="demarcarLinhaCheckbox"> Demarcar linha</label>
        <label><input type="checkbox" id="removerDemarcacaoCheckbox"> Remover demarcação</label>
        <label><input type="checkbox" id="ignorarDuplicatasCheckbox"> Ignorar destaque de duplicatas</label>
        <label><input type="checkbox" id="toggleAllCheckboxesHeader"> Marcar/Desmarcar Todos</label>
    </div>

    <div class="filter-controls">
        <h3><span class="material-symbols-outlined">filter_alt</span> Filtrar por Nível</h3>
        <div id="checkboxNiveis">
        </div>
        <button id="limparFiltroNivelBtn">Limpar Filtro</button>
    </div>

    <div class="table-container">
        <table id="listaTabela">
            <thead>
            <tr>
                <th><input type="checkbox" id="toggleAllCheckboxes"></th>
                <th class="seq-col">SEQ</th>
                <th class="nivel-col">NÍVEL</th> <th>SITE</th>
                <th>ALTERNATIVA</th>
                <th>CÓDIGO_MATERIAL</th>
                <th>TIPO ESTRUTURA</th>
                <th>LINHA</th>
                <th>ITEM_COMPONENTE</th>
                <th>QTDE_MONTAGEM</th>
                <th>UNIDADE DE MEDIDA</th>
                <th>FATOR_SUCATA</th>
            </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
<script src="filtro_nivel.js"></script>
</body>
</html>
